server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: finman-backend

  # Datasource Configuration (PostgreSQL 16 on Port 5432 - HikariCP)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finman_db}
    username: ${SPRING_DATASOURCE_USERNAME:finman_user}
    password: ${SPRING_DATASOURCE_PASSWORD:finman_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: FinManHikariCP
      auto-commit: false

  # Redis Configuration (Redis 7 on Port 6379 - Lettuce)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      client-type: lettuce

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # Flyway Migration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "Baseline migration for FinMan"
    validate-on-migrate: true
    out-of-order: false

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
    default-property-inclusion: non_null

  # Servlet Multipart (for file uploads)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Security (JWT config)
  security:
    jwt:
      secret: ${JWT_SECRET:finman-super-secret-key-change-in-production-min-256-bits}
      expiration: 86400000 # 24 hours in milliseconds
      refresh-expiration: 604800000 # 7 days in milliseconds

# Actuator & Health Checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true

# Logging Configuration
logging:
  level:
    com.finman: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/finman-backend.log

# CORS Configuration
cors:
  allowed-origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
  allowed-methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# Google Gemini AI Configuration
gemini:
  api:
    key: ${GEMINI_API_KEY:AIzaSyD-dummy-gemini-api-key-for-testing-12345}
    url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}

# Application-specific properties
app:
  pagination:
    default-page-size: 20
    max-page-size: 100
  currency:
    default: VND
    minor-units: 0
  file-upload:
    max-size: 10485760 # 10MB
    allowed-types:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.ms-excel
      - text/csv
