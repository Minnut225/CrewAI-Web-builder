# ==============================================================================
# tasks.yaml - Autonomous Software Engineering Work Breakdown Structure & Tasks
# ==============================================================================

# ------------------------------------------------------------------------------
# STAGE 1: BA Requirement Analysis & Atomic Task Decomposition (Approach A)
# ------------------------------------------------------------------------------
ba_decomposition_task:
  description: >
    YOU ARE THE LEAD BUSINESS ANALYST & SYSTEM ARCHITECT. YOUR MISSION IS TO ANALYZE REQUIREMENTS FOR '{target_phase}' AND DECOMPOSE IT INTO AN ATOMIC WORK BREAKDOWN STRUCTURE (WBS).

    INPUT SPECIFICATIONS:
    - Target Phase Scope: {phase_scope}
    - Plans Folder: '{plans_dir}' ({plan_files})
    - Architecture & PRD Summary: {plans_summary}
    - Design Folder: '{design_dir}'

    AUDIT & RECONNAISSANCE (MANDATORY):
    1. Read '{plans_dir}/PRD.md' and '{plans_dir}/ARCHITECTURE_PLAN.md' using `read_file` to thoroughly inspect the domain requirements, database schema, and REST specifications.
    2. Audit existing code on disk:
       - Check existing entities and packages in 'backend/src/main/java/'
       - Check existing services in 'backend/src/main/java/'
       - Check existing UI mockups in '{design_dir}/' using `list_dir`
    3. DOMAIN INTEGRITY & ANTI-HALLUCINATION RULE:
       - Strictly adhere to the domain rules, entities, and business logic defined in '{plans_dir}'.
       - Never invent features, mock data models, or endpoints that contradict the project specifications.
       - Precision Rule: Monetary and high-precision numeric values MUST use Java Long or BigDecimal (Zero-Float rule).

    DECOMPOSITION INSTRUCTIONS (APPROACH A - TIERED ATOMIC TASKS):
    Decompose the target phase into exactly 3 Backend sub-tasks, 2 Frontend sub-tasks, and 1 QA verification task:

    1. BACKEND TIER:
       - Task BE-1 (Data Contracts & Repositories): Entities, Enums, camelCase Request/Response DTOs, Spring Data JPA Repositories matching the package structure in 'backend/src/main/java/'.
       - Task BE-2 (Business Logic & Services): Service Interfaces in 'service/<Name>Service.java' AND Service Implementations in 'service/impl/<Name>ServiceImpl.java'. Enforce ACID (@Transactional) and numeric precision.
       - Task BE-3 (REST Controllers, Security & Tests): Spring REST Controllers with camelCase DTOs, SecurityConfig endpoints, and JUnit 5 / Mockito tests.

    2. FRONTEND TIER:
       - Task FE-1 (Types & API Services): TypeScript interfaces in 'src/types/' matching backend DTOs 1:1, and API service clients in 'src/services/' using authenticated 'api' instance.
       - Task FE-2 (UI Pages, Components & Design System Layout): Replicating UI mockups from '{design_dir}', incorporating application shell layout (Navigation Sidebar, Header) and design tokens.

    3. QA TIER:
       - Task QA-1 (Acceptance Criteria & Integration): Formulate 3-5 concrete, testable acceptance criteria to verify for this phase.

    REQUIRED OUTPUT FORMAT:
    You MUST output a detailed Markdown report followed by a SINGLE fenced JSON code block at the end with the EXACT schema:
    ```json
    {
      "phase_name": "{target_phase}",
      "summary": "High-level architectural summary of the phase",
      "backend_tasks": [
        {
          "task_id": "BE-1",
          "title": "Data Contracts & Repositories",
          "target_files": ["backend/.../entity/...", "backend/.../dto/..."],
          "details": "Specific entity fields, DTO contracts, repository methods"
        },
        {
          "task_id": "BE-2",
          "title": "Business Logic & Services (ACID & Precision)",
          "target_files": ["backend/.../service/...Service.java", "backend/.../service/impl/...ServiceImpl.java"],
          "details": "Interface methods, implementation logic, transactional data integrity"
        },
        {
          "task_id": "BE-3",
          "title": "REST Controllers, Security & Tests",
          "target_files": ["backend/.../controller/...", "backend/.../config/SecurityConfig.java", "backend/src/test/..."],
          "details": "Endpoints, HTTP methods, security rules, test methods"
        }
      ],
      "frontend_tasks": [
        {
          "task_id": "FE-1",
          "title": "TypeScript Types & API Services",
          "target_files": ["frontend/src/types/...", "frontend/src/services/..."],
          "details": "TypeScript interfaces matching backend DTOs, API methods using api client"
        },
        {
          "task_id": "FE-2",
          "title": "UI Pages, Components & Design System Layout",
          "target_files": ["frontend/src/pages/...", "frontend/src/components/..."],
          "details": "Application shell layout, Navigation, Header, Design system tokens"
        }
      ],
      "acceptance_criteria": [
        "mvn test passes with 0 failures and 0 errors",
        "npm run build passes with 0 TypeScript/Vite errors",
        "Specific business rule criteria..."
      ]
    }
    ```
  expected_output: >
    A comprehensive Architectural Plan and WBS Markdown report ending with the valid JSON block containing the decomposed atomic tasks.
  agent: ba

