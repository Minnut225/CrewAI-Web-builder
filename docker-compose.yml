services:
  postgres:
    image: postgres:16-alpine
    container_name: finman-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finman_db}
      POSTGRES_USER: ${POSTGRES_USER:-finman_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finman_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finman_user} -d ${POSTGRES_DB:-finman_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - finman-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: finman-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - finman-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finman-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-finman_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-finman_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-finman_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-finman-super-secret-key-change-in-production-min-256-bits}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - finman-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finman-frontend
    ports:
      - "3000:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - finman-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8.13
    container_name: finman-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@finman.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - finman-network
    restart: unless-stopped
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  finman-network:
    driver: bridge
    name: finman-network